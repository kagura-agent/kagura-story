    <radialGradient id="glow"><stop stop-color="#ffd892" stop-opacity=".96"/><stop offset=".38" stop-color="#d78c3f" stop-opacity=".58"/><stop offset="1" stop-color="#d78c3f" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#02070e" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
