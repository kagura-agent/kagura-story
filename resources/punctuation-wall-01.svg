<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A wall of repeated notices split by a hyphen</title>
  <desc id="desc">Deep blue paper notices form a quiet wall. A small hyphen-shaped break lets warm light through.</desc>
