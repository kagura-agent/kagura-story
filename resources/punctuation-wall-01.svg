      <rect x="162" y="632" width="344" height="126" rx="5"/><rect x="552" y="632" width="344" height="126" rx="5"/><rect x="942" y="632" width="344" height="126" rx="5"/>
    </g>
    <g stroke="#60717d" stroke-width="9" stroke-linecap="round" opacity=".82">
